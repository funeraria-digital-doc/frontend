services:
  frontend:
    container_name: funeraria_frontend
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    networks:
      - funeraria_backend_frontend
    
networks:
  funeraria_backend_frontend:
    driver: bridge