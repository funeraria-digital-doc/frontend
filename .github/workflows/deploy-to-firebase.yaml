name: Deploy to Firebase

on:
  push:
    branches:
      - try-github-actions

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: List folders
        run: ls -la

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install 

      - name: Build project
        run: npm run build-only

    #   - name: Deploy to Firebase
    #     uses: w9jds/firebase-action@v1
    #     with:
    #       args: deploy --project <your-firebase-project-id>
